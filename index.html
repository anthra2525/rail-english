す。"},{"id":"re11_800_c32","level":800,"kind":"cloze","skill":"語彙","text":"Participants must _____ their attendance by replying to the invitation email.","options":["confuse","confine","conform","confirm"],"answer":3,"translation":"参加者は招待メールに返信して、出席することを確認しなければなりません。","explanation":"confirm attendance は「出席を確認する」。conform は従う、confine は制限するです。"},{"id":"re11_800_c33","level":800,"kind":"cloze","skill":"語彙","text":"The repair work will cause only a _____ interruption to the water supply.","options":["bright","brave","broad","brief"],"answer":3,"translation":"修理による断水は、ごく短時間にとどまります。","explanation":"brief は「短時間の」。interruption を修飾します。broad は広い、bright は明るいです。"},{"id":"re11_800_c34","level":800,"kind":"cloze","skill":"語彙","text":"All entries must be _____; work copied from other artists will be rejected.","options":["occasional","original","optional","ordinary"],"answer":1,"translation":"応募作品はすべて独創的なものでなければならず、他の作家の作品を模倣したものは受け付けません。","explanation":"original は「独自の・創作による」。後半の copied ... will be rejected が手掛かりです。"},{"id":"re11_800_c35","level":800,"kind":"cloze","skill":"日程・会議","text":"Could you _____ with the venue staff to arrange access before eight?","options":["locate","lease","liaise","launch"],"answer":2,"translation":"8時より前に入館できるよう、会場のスタッフと連絡・調整していただけますか。","explanation":"liaise with は「〜と連絡を取り合う・調整する」。lease は賃貸する、launch は開始するです。"},{"id":"re11_800_c36","level":800,"kind":"cloze","skill":"日程・会議","text":"We can discuss staffing under the final _____ of the meeting.","options":["purchase order","expense claim","business trip","agenda item"],"answer":3,"translation":"会議の最後の議題で、人員配置について話し合えます。","explanation":"agenda item は「議題の項目」。expense claim は経費請求、purchase order は発注書です。"},{"id":"re11_800_c37","level":800,"kind":"cloze","skill":"日程・会議","text":"The date is _____ until the keynote speaker confirms her availability.","options":["consecutive","immediate","durable","tentative"],"answer":3,"translation":"基調講演者の都合が確認されるまで、その日程は仮のものです。","explanation":"tentative は「仮の・暫定的な」。確定を待っているという until 以下の内容と結び付けます。"},{"id":"re11_800_c38","level":800,"kind":"cloze","skill":"日程・会議","text":"Please notify us of any changes at your earliest _____.","options":["conveniently","convenient","convenience","convene"],"answer":2,"translation":"変更があれば、ご都合のつき次第できるだけ早くお知らせください。","explanation":"at your earliest convenience は「ご都合のつき次第早めに」。your の後ろには名詞 convenience を置きます。"},{"id":"re11_800_c39","level":800,"kind":"cloze","skill":"品詞","text":"The proposal received _____ approval from all members of the board.","options":["unanimity","unanimously","unanimities","unanimous"],"answer":3,"translation":"その提案は、取締役会の全メンバーから全会一致の承認を得ました。","explanation":"名詞 approval を修飾する形容詞 unanimous（全会一致の）。unanimously は副詞、unanimity は名詞です。"},{"id":"re11_800_c40","level":800,"kind":"cloze","skill":"品詞","text":"The system automatically checks the _____ of each customer address.","options":["accurately","accuracy","accurate","accuracies"],"answer":1,"translation":"システムは各顧客住所の正確さを自動的に確認します。","explanation":"the ... of の形で「正確さ」という抽象名詞 accuracy を使います。ここでは個々の正確さを複数の物として数えません。"},{"id":"re11_800_c41","level":800,"kind":"cloze","skill":"動名詞・不定詞","text":"The company is committed to _____ waste at all of its factories.","options":["reduction","reduce","reducing","reduced"],"answer":2,"translation":"会社は、すべての工場で廃棄物を減らすことに取り組んでいます。","explanation":"be committed to doing で「〜に取り組む」。to は前置詞なので reducing。reduction waste という並びにはできません。"},{"id":"re11_800_c42","level":800,"kind":"cloze","skill":"数量","text":"We have _____ time to test the system thoroughly before launch.","options":["several","many","enough","few"],"answer":2,"translation":"公開前にシステムを十分にテストする時間があります。","explanation":"不可算名詞 time の前に置けるのは enough。many、few、several は可算名詞の複数形を取ります。"},{"id":"re11_800_c43","level":800,"kind":"cloze","skill":"語彙","text":"The store will _____ its range of products to include locally made furniture.","options":["brighten","bother","borrow","broaden"],"answer":3,"translation":"その店は地元製の家具も扱うよう、商品の品ぞろえを広げます。","explanation":"broaden は「広げる」。broaden its range で扱う範囲の拡大を表します。borrow は借りるです。"},{"id":"re11_800_c44","level":800,"kind":"cloze","skill":"受動態","text":"Refunds can only _____ after the returned goods have been inspected.","options":["processing","process","be processed","be processing"],"answer":2,"translation":"返金は、返品された商品の検品後にのみ処理できます。","explanation":"Refunds は処理される側なので、助動詞 can の後に be processed という受け身を置きます。"},{"id":"re11_800_c45","level":800,"kind":"cloze","skill":"接続詞","text":"Please remain seated _____ your row number is called.","options":["until","despite","during","whereas"],"answer":0,"translation":"ご自分の列の番号が呼ばれるまで、着席したままお待ちください。","explanation":"着席の継続の終点を表す until。during と despite はこのような節を直接取りません。"},{"id":"re11_850_c01","level":850,"kind":"cloze","skill":"倒置","text":"No sooner had the presentation begun _____ the fire alarm sounded.","options":["than","then","when","that"],"answer":0,"translation":"プレゼンテーションが始まるやいなや、火災報知器が鳴りました。","explanation":"No sooner had ... than ... で「〜するやいなや…」。Hardly had ... when ... との組み合わせの違いに注意します。"},{"id":"re11_850_c02","level":850,"kind":"cloze","skill":"倒置","text":"Not until the final inspection was complete _____ the laboratory reopen.","options":["was","had","did","has"],"answer":2,"translation":"最終検査が終わって初めて、研究所は再開しました。","explanation":"Not until ... を文頭に置くと主節が倒置されます。後ろが原形 reopen なので did the laboratory reopen です。"},{"id":"re11_850_c03","level":850,"kind":"cloze","skill":"仮定法","text":"If the supplier had warned us sooner, we _____ the launch date.","options":["will change","can change","could have changed","have changed"],"answer":2,"translation":"供給会社がもっと早く知らせていれば、発売日を変更できたでしょう。","explanation":"過去の事実と異なる条件なので、主節は could have ＋過去分詞。had warned と対応させます。"},{"id":"re11_850_c04","level":850,"kind":"cloze","skill":"接続詞","text":"The agreement will remain in force _____ either party gives thirty days' written notice.","options":["unless","even though","whereas","because of"],"answer":0,"translation":"どちらか一方が30日前に書面で通知しない限り、その契約は有効なままです。","explanation":"unless は「〜しない限り」。通知という解除条件が満たされなければ有効である、と読み取ります。"},{"id":"re11_850_c05","level":850,"kind":"cloze","skill":"接続詞","text":"The company expanded its delivery area, _____ smaller rivals reduced theirs.","options":["whereas","therefore","despite","otherwise"],"answer":0,"translation":"その会社は配送区域を拡大した一方、小規模な競合企業は自社の区域を縮小しました。","explanation":"対照的な2つの節をつなぐ接続詞 whereas。therefore と otherwise は、このコンマだけでは節を接続できません。"},{"id":"re11_850_c06","level":850,"kind":"cloze","skill":"前置詞","text":"_____ the initial objections, the board voted to proceed with the renovation.","options":["Notwithstanding","However","Nevertheless","Although"],"answer":0,"translation":"当初の反対にもかかわらず、取締役会は改装を進めることを決議しました。","explanation":"Notwithstanding はここでは前置詞「〜にもかかわらず」。後ろが名詞句 the initial objections であることも確認します。"},{"id":"re11_850_c07","level":850,"kind":"cloze","skill":"語彙","text":"Sales rose in the northern region; _____, they declined sharply in the south.","options":["accordingly","similarly","additionally","conversely"],"answer":3,"translation":"北部では売上が伸びましたが、対照的に南部では大幅に減少しました。","explanation":"conversely は「反対に・対照的に」。similarly は同様に、additionally はさらにで、対比には合いません。"},{"id":"re11_850_c08","level":850,"kind":"cloze","skill":"語彙","text":"The two divisions reported profits of $4 million and $6 million, _____.","options":["respectively","resolutely","respectably","respectfully"],"answer":0,"translation":"2つの部門は、それぞれ400万ドルと600万ドルの利益を報告しました。","explanation":"respectively は「それぞれ、述べた順に」。respectfully は敬意をもって、respectably は立派にです。"},{"id":"re11_850_c09","level":850,"kind":"cloze","skill":"語彙","text":"Given the limited budget, constructing a second entrance is not financially _____.","options":["feasible","portable","visible","eligible"],"answer":0,"translation":"予算が限られているため、第2の入口を建設することは資金面で実現可能ではありません。","explanation":"feasible は「実行可能な」。financially feasible で資金面の実現可能性を表します。"},{"id":"re11_850_c10","level":850,"kind":"cloze","skill":"語彙","text":"As a result of a clerical error, an outdated price list was _____ sent to customers.","options":["inadvertently","deliberately","consistently","accurately"],"answer":0,"translation":"事務上のミスにより、古い価格表がうっかり顧客に送られてしまいました。","explanation":"inadvertently は「うっかり・意図せず」。deliberately は意図的に。a clerical error（事務上のミス）が、意図的ではないことを示します。"},{"id":"re11_850_c11","level":850,"kind":"cloze","skill":"語彙","text":"The improvement in delivery times is largely _____ to the new routing software.","options":["attentive","attributable","accountable","applicable"],"answer":1,"translation":"配送時間の改善は、主に新しい経路設定ソフトウェアのおかげです。","explanation":"be attributable to で「〜に起因する」。accountable は責任を負う、applicable は適用できるです。"},{"id":"re11_850_c12","level":850,"kind":"cloze","skill":"前置詞","text":"Employees may take an extra day off in _____ of payment for the holiday shift.","options":["spite","lieu","charge","view"],"answer":1,"translation":"従業員は祝日の勤務手当の代わりに、追加の休暇を1日取れます。","explanation":"in lieu of は「〜の代わりに」。in view of は〜を考慮して、in charge of は〜を担当してです。"},{"id":"re11_850_c13","level":850,"kind":"cloze","skill":"語彙","text":"The lease renewal is _____ upon the tenant completing the required repairs.","options":["conditioning","condition","conditionally","conditional"],"answer":3,"translation":"賃貸契約の更新は、借主が必要な修繕を完了することを条件としています。","explanation":"be conditional upon は「〜を条件とする」。be動詞の補語として形容詞 conditional を選びます。"},{"id":"re11_850_c14","level":850,"kind":"cloze","skill":"品詞","text":"The audit revealed several _____ weaknesses in the stock-control process.","options":["significant","significance","significantly","signify"],"answer":0,"translation":"監査により、在庫管理の手順にいくつかの重大な弱点が明らかになりました。","explanation":"複数名詞 weaknesses を修飾する形容詞 significant。several と名詞の間で品詞を見極めます。"},{"id":"re11_850_c15","level":850,"kind":"cloze","skill":"分詞","text":"_____ adequate notice, most clients were able to adjust their schedules.","options":["Having given","To have given","Giving","Having been given"],"answer":3,"translation":"十分な事前通知を受けていたため、ほとんどの顧客は予定を調整できました。","explanation":"clients は通知を与えられた側。主節より前に受けたことを表す、受け身の完了分詞構文 Having been given を使います。"},{"id":"re11_850_c16","level":850,"kind":"cloze","skill":"分詞","text":"The report, _____ on interviews with local residents, recommends expanding bus services.","options":["basing","basis","bases","based"],"answer":3,"translation":"地元住民への聞き取りに基づくその報告書は、バスサービスの拡充を勧めています。","explanation":"be based on の受け身の関係なので、過去分詞 based が report を修飾します。文の動詞は recommends です。"},{"id":"re11_850_c17","level":850,"kind":"cloze","skill":"関係詞","text":"The revised policy, the details of _____ are available online, takes effect next month.","options":["what","which","whose","that"],"answer":1,"translation":"詳細がオンラインで確認できる改定方針は、来月施行されます。","explanation":"the details of which で「その詳細」。先行詞 the revised policy を受け、前置詞 of の後ろに which を置きます。"},{"id":"re11_850_c18","level":850,"kind":"cloze","skill":"数量","text":"There is _____ likelihood of meeting the deadline unless additional staff are assigned.","options":["fewer","little","few","many"],"answer":1,"translation":"追加の人員が配置されない限り、締切に間に合う見込みはほとんどありません。","explanation":"ここで likelihood（見込み）は不可算の扱いなので little。「ほとんどない」という否定的な意味です。"},{"id":"re11_850_c19","level":850,"kind":"cloze","skill":"比較","text":"The revised estimate is no _____ accurate than the original; both contain the same error.","options":["most","more","much","many"],"answer":1,"translation":"修正後の見積もりも元のものより正確というわけではなく、どちらにも同じ誤りがあります。","explanation":"no more ... than で「〜より…というわけではない」。後半が、修正版にも同じ問題があることを示しています。"},{"id":"re11_850_c20","level":850,"kind":"cloze","skill":"動名詞・不定詞","text":"The consultant objected to _____ responsible for delays beyond her control.","options":["hold","be holding","being held","have held"],"answer":2,"translation":"コンサルタントは、自分では制御できない遅延の責任を負わされることに異議を唱えました。","explanation":"object to の to は前置詞。hold 人 responsible の受け身を動名詞にして being held responsible とします。"},{"id":"re11_850_c21","level":850,"kind":"cloze","skill":"語彙","text":"The warranty will be _____ if the device is opened by an unauthorized technician.","options":["vague","void","versatile","vacant"],"answer":1,"translation":"認可を受けていない技術者が機器を開けた場合、保証は無効になります。","explanation":"void は「無効な」。vacant は空いている、vague は曖昧な、versatile は多用途のです。"},{"id":"re11_850_c22","level":850,"kind":"cloze","skill":"語彙","text":"The manufacturer will _____ the older model once the replacement is widely available.","options":["disclose","distinguish","distribute","discontinue"],"answer":3,"translation":"代替機種が広く入手できるようになったら、メーカーは旧モデルの販売を終了します。","explanation":"discontinue は「生産・販売などをやめる」。disclose は開示する、distribute は配布するです。"},{"id":"re11_850_c23","level":850,"kind":"cloze","skill":"語彙","text":"The company decided to _____ the extra shipping cost rather than pass it on to customers.","options":["absorb","reserve","preserve","observe"],"answer":0,"translation":"会社は追加の送料を顧客に転嫁せず、自社で負担することにしました。","explanation":"absorb a cost は「費用を吸収する・負担する」。pass it on to customers との対比で判断します。"},{"id":"re11_850_c24","level":850,"kind":"cloze","skill":"語彙","text":"The committee could not reach a _____ on which site to develop.","options":["concession","consequence","consumption","consensus"],"answer":3,"translation":"委員会は、どの用地を開発するかについて合意に達しませんでした。","explanation":"reach a consensus で「合意に達する」。concession は譲歩、consequence は結果です。"},{"id":"re11_850_c25","level":850,"kind":"cloze","skill":"語彙","text":"The supplier's repeated delays have _____ our confidence in its reliability.","options":["undertaken","underlined","undergone","undermined"],"answer":3,"translation":"供給会社の度重なる遅延によって、その信頼性に対する私たちの信用は損なわれました。","explanation":"undermine confidence は「信頼を損なう」。underline は強調する、undertake は引き受けるです。"},{"id":"re11_850_c26","level":850,"kind":"cloze","skill":"語彙","text":"We need to _____ between errors caused by the software and those caused by incorrect input.","options":["dismiss","distract","distinguish","distribute"],"answer":2,"translation":"ソフトウェアに起因する誤りと、入力ミスに起因する誤りを区別する必要があります。","explanation":"distinguish between A and B で「AとBを区別する」。those は errors の繰り返しを避けています。"},{"id":"re11_850_c27","level":850,"kind":"cloze","skill":"語彙","text":"The forecast is based on the _____ that material prices will remain stable.","options":["assistance","assignment","assembly","assumption"],"answer":3,"translation":"その予測は、材料価格が安定したままだという仮定に基づいています。","explanation":"based on the assumption that ... で「〜という仮定に基づいて」。assembly は組み立て・集会、assignment は割り当て・課題です。"},{"id":"re11_850_c28","level":850,"kind":"cloze","skill":"語彙","text":"The new procedure aims to _____ duplicate data entry and shorten processing times.","options":["illustrate","illuminate","imitate","eliminate"],"answer":3,"translation":"新しい手順は、データの二重入力をなくし、処理時間を短縮することを目指しています。","explanation":"eliminate は「取り除く・なくす」。illuminate は照らす、illustrate は説明する、imitate はまねるです。"},{"id":"re11_850_c29","level":850,"kind":"cloze","skill":"語彙","text":"The director asked the team to _____ the risks before committing to the expansion.","options":["access","assist","assign","assess"],"answer":3,"translation":"部長はチームに、事業拡大を決める前にリスクを評価するよう求めました。","explanation":"assess the risks は「リスクを評価する」。access はアクセスする、assist は支援する、assign は割り当てるです。"},{"id":"re11_850_c30","level":850,"kind":"cloze","skill":"語彙","text":"Applicants must meet several _____ criteria; none of these requirements is optional.","options":["monetary","mandatory","momentary","manageable"],"answer":1,"translation":"申請者はいくつかの必須の基準を満たす必要があり、任意の条件は一つもありません。","explanation":"mandatory は「義務的な・必須の」。none ... is optional が手掛かり。monetary は金銭の、momentary は一瞬のです。"},{"id":"re11_850_c31","level":850,"kind":"cloze","skill":"語彙","text":"The firm has _____ rights to distribute the product in this region; no other distributor is permitted.","options":["excessive","exclusive","expressive","inclusive"],"answer":1,"translation":"その企業はこの地域での独占的な販売権を持ち、ほかの販売業者は認められていません。","explanation":"exclusive rights は「独占権」。後半が独占であることを明示しています。excessive は過度のです。"},{"id":"re11_850_c32","level":850,"kind":"cloze","skill":"語彙","text":"Although the trial was promising, the evidence is still too _____ to justify a full rollout.","options":["overwhelming","limited","limitless","definitive"],"answer":1,"translation":"試験導入は有望でしたが、全面展開を正当化するには証拠がまだ乏しすぎます。","explanation":"too limited to ... で「限定的すぎて〜できない」。promising でも判断材料が十分ではない、という対比です。"},{"id":"re11_850_c33","level":850,"kind":"cloze","skill":"前置詞","text":"The training is designed for all employees, _____ of whether they work on-site or remotely.","options":["apart","irrespective","because","instead"],"answer":1,"translation":"この研修は、出社か在宅かにかかわらず、全従業員を対象にしています。","explanation":"irrespective of は「〜にかかわらず」。whether 以下の2つの勤務形態をどちらも含みます。"},{"id":"re11_850_c34","level":850,"kind":"cloze","skill":"前置詞","text":"The distributor acted on _____ of the manufacturer during the negotiations.","options":["benefit","favor","behalf","purpose"],"answer":2,"translation":"販売会社は交渉の間、メーカーを代表して行動しました。","explanation":"on behalf of は「〜を代表して・〜に代わって」。benefit は利益、purpose は目的、favor は好意です。ここでは代表者としての役割を問います。"},{"id":"re11_850_c35","level":850,"kind":"cloze","skill":"語彙","text":"The proposed merger is subject to _____ by the competition authority.","options":["approval","approved","approving","approve"],"answer":0,"translation":"提案されている合併には、競争当局の承認が必要です。","explanation":"be subject to approval は「承認を条件とする」。to は前置詞で、ここでは承認という行為を名詞 approval で表します。"},{"id":"re11_850_c36","level":850,"kind":"cloze","skill":"品詞","text":"The figures in the appendix are for _____ purposes and should not be treated as forecasts.","options":["illustrate","illustratively","illustrative","illustrator"],"answer":2,"translation":"付録の数値は例示を目的としたものであり、予測値として扱ってはいけません。","explanation":"purposes を修飾する形容詞 illustrative。「説明用の例」であって予測ではないという注意です。"},{"id":"re11_850_c37","level":850,"kind":"cloze","skill":"語彙","text":"A prolonged interruption could have serious _____ for our delivery commitments.","options":["implementations","impressions","invitations","implications"],"answer":3,"translation":"長期の中断は、納期の約束に重大な影響を及ぼす可能性があります。","explanation":"have implications for は「〜に影響を持つ」。implementation は実施、impression は印象です。"},{"id":"re11_850_c38","level":850,"kind":"cloze","skill":"語彙","text":"The new rules apply _____ to contracts signed after July 1, not to earlier agreements.","options":["mutually","solely","barely","previously"],"answer":1,"translation":"新しい規則は7月1日以降に署名された契約にのみ適用され、以前の契約には適用されません。","explanation":"solely は「〜だけに」。後半の not to earlier agreements が適用範囲を限定しています。"},{"id":"re11_850_c39","level":850,"kind":"cloze","skill":"語彙","text":"The supplier proposed a _____ arrangement to keep deliveries moving until the permanent depot opened.","options":["provisional","proficient","prominent","productive"],"answer":0,"translation":"供給会社は、常設の配送拠点が開くまで配送を続けるため、暫定的な取り決めを提案しました。","explanation":"provisional は「暫定的な」。until the permanent depot opened から、一時的な対応だと判断します。"},{"id":"re11_850_c40","level":850,"kind":"cloze","skill":"語彙","text":"All bidders must _____ any potential conflicts of interest before submitting a proposal.","options":["dispose","displace","disclose","dissolve"],"answer":2,"translation":"すべての入札者は、提案書を提出する前に、利益相反の可能性を開示しなければなりません。","explanation":"disclose は情報を「開示する」。dispose は処分する、displace は取って代わるです。"},{"id":"re11_850_c41","level":850,"kind":"cloze","skill":"主語と動詞","text":"A series of technical problems _____ delayed the launch by several weeks.","options":["has","are","have","were"],"answer":0,"translation":"一連の技術的な問題により、公開が数週間遅れています。","explanation":"主語の中心は単数の A series なので has。of technical problems に引きずられず、has delayed とします。"},{"id":"re11_850_c42","level":850,"kind":"cloze","skill":"動名詞・不定詞","text":"The site manager reminded contractors _____ the inspection checklist before leaving.","options":["to complete","completed","complete","completing"],"answer":0,"translation":"現場責任者は請負業者に、退出前に点検表を記入するよう念を押しました。","explanation":"remind 人 to do で「人に〜することを念押しする」。動名詞ではなく to complete です。"},{"id":"re11_850_c43","level":850,"kind":"cloze","skill":"接続詞","text":"The report explains _____ the proposed changes would affect small businesses.","options":["what","whose","which","how"],"answer":3,"translation":"その報告書は、提案された変更が小規模企業にどのように影響するかを説明しています。","explanation":"後ろの節には主語・動詞・目的語がそろっており、影響の仕方を表す how を選びます。"},{"id":"re11_850_c44","level":850,"kind":"cloze","skill":"品詞","text":"The security review was _____ conducted by specialists with no ties to the development team.","options":["independently","independence","independent","independents"],"answer":0,"translation":"安全性の審査は、開発チームと関わりのない専門家によって独立して実施されました。","explanation":"conducted を直前から修飾する副詞 independently（独立して）。independent は形容詞、independence は名詞です。"},{"id":"re11_850_c45","level":850,"kind":"cloze","skill":"語彙","text":"The offer is _____ on receiving the initial payment by Friday; otherwise it will be withdrawn.","options":["congested","contingent","concentrated","consistent"],"answer":1,"translation":"その申し出は金曜日までに初回支払いを受領することが条件で、そうでなければ撤回されます。","explanation":"be contingent on で「〜を条件とする」。支払いが成立条件だという後半も手掛かりになります。"},{"id":"re11_730_r01","level":730,"kind":"reading","skill":"読解","text":"What should the reader bring when collecting the book?","options":["A payment receipt and a photograph","A library card and a reservation number","A letter from another library","A completed membership application"],"answer":1,"translation":"質問：本を受け取るときに何を持参する必要がありますか。\n正解：図書館カードと予約番号。","explanation":"Bring の直後に必要なものが2つ並んでいます。料金の支払いや新規の入会は求められていません。","title":"予約した本の受け取り","passage":"Westfield Library — Reservation ready\n\nThe book you requested is now at our Riverside branch. Please collect it within five days. Bring your library card and the reservation number shown in this message. Books cannot be collected at another branch. If you need more time, call the Riverside desk before the collection period ends.","proof":"Bring your library card and the reservation number shown in this message."},{"id":"re11_730_r02","level":730,"kind":"reading","skill":"読解","text":"When will the cafe open on Wednesday?","options":["At 7 p.m.","It will remain closed all day.","At 8 a.m.","At noon"],"answer":3,"translation":"質問：水曜日、カフェは何時に開店しますか。\n正解：正午。","explanation":"水曜日は8時から正午まで研修で休み、reopen at noon とあります。7時は通常どおりの閉店時刻です。","title":"カフェの営業時間","passage":"Notice to our customers\n\nThe Green Lane Cafe will be closed from 8 a.m. to noon on Wednesday for staff training. We will reopen at noon and close at our usual time of 7 p.m. Online orders will also be unavailable during the training. Our regular opening hours will resume on Thursday.","proof":"We will reopen at noon and close at our usual time of 7 p.m."},{"id":"re11_730_r03","level":730,"kind":"reading","skill":"読解","text":"Where should passengers board Route 14 during the repairs?","options":["At the train station","Beside the library entrance","Behind the town hall","Outside the museum gift shop"],"answer":1,"translation":"質問：工事中、14番のバスにはどこで乗ればよいですか。\n正解：図書館の入口の脇。","explanation":"Please use the temporary stop が代わりの乗車場所を指示しています。時刻や料金の変更ではありません。","title":"バス停の一時移設","passage":"Route 14 — Temporary stop\n\nFrom May 3 to May 9, buses will not stop outside the Central Museum because the pavement is being repaired. Please use the temporary stop beside the public library entrance, about 100 meters east of the museum. Departure times and fares will not change. The usual stop will reopen on May 10.","proof":"Please use the temporary stop beside the public library entrance"},{"id":"re11_730_r04","level":730,"kind":"reading","skill":"読解","text":"What is Daniel asked to do?","options":["Change his hotel booking","Send a copy of his hotel receipt","Purchase another train ticket","Complete a new claim form"],"answer":1,"translation":"質問：ダニエルは何をするよう求められていますか。\n正解：ホテルの領収書の写しを送る。","explanation":"不足しているのは hotel stay の領収書です。train receipt は受領済みで、申請書を再記入する必要もありません。","title":"経費申請への返信","passage":"To: Daniel Price\nSubject: Travel expense claim\n\nThank you for submitting your claim. We have your train receipt, but the receipt for your hotel stay is missing. Please email a scanned copy by Friday. Once we receive it, we can include your reimbursement in the next payment run. You do not need to complete the claim form again.","proof":"Please email a scanned copy by Friday."},{"id":"re11_730_r05","level":730,"kind":"reading","skill":"読解","text":"What must visitors wear?","options":["Protective gloves throughout the tour","A helmet brought from home","Shoes that cover their toes","A company uniform"],"answer":2,"translation":"質問：見学者は何を身に着けなければなりませんか。\n正解：つま先が覆われた靴。","explanation":"closed-toe shoes の言い換えです。ヘルメットは支給されるので、自宅から持参する必要はありません。","title":"工場見学の案内","passage":"Visitor information — Mill Road Factory\n\nYour guided tour starts at 10:30 a.m. Please arrive at reception fifteen minutes early. All visitors must wear closed-toe shoes; sandals are not permitted inside the production area. Safety helmets will be provided. Photography is allowed in the visitor center only, not on the factory floor.","proof":"All visitors must wear closed-toe shoes; sandals are not permitted"},{"id":"re11_730_r06","level":730,"kind":"reading","skill":"読解","text":"Which purchase qualifies for a free pen?","options":["Two pens bought in a store","One notebook bought online","Two notebooks bought in a store","Two notebooks bought online"],"answer":2,"translation":"質問：無料のペンが付くのはどの購入ですか。\n正解：店舗でノートを2冊購入すること。","explanation":"2冊購入が条件で、対象は店舗での買い物です。Online purchases are not included と除外が明記されています。","title":"文具店の特典","passage":"Cedar Stationery — This week's offer\n\nBuy any two notebooks and receive a free pen. The offer is available in our stores until Sunday while supplies last. Online purchases are not included. You may choose notebooks of different sizes or colors. One free pen is provided for each pair of notebooks purchased.","proof":"The offer is available in our stores until Sunday while supplies last."},{"id":"re11_730_r07","level":730,"kind":"reading","skill":"読解","text":"How should someone apply for the position?","options":["Email a resume to the manager","Call customers for references","Visit the store with a resume","Attend a flower-arranging class first"],"answer":0,"translation":"質問：この仕事にはどう応募すればよいですか。\n正解：店長に履歴書をメールで送る。","explanation":"Applicants should email と応募方法が示されています。履歴書の店舗持参はしないよう求められています。","title":"求人への応募方法","passage":"Part-time assistant wanted\n\nElm Street Florist is looking for an assistant to work on Saturday mornings. Previous experience with flowers is not necessary because training will be provided. Applicants should email a short resume to the shop manager. Please do not bring applications to the store, as our staff may be busy serving customers.","proof":"Applicants should email a short resume to the shop manager."},{"id":"re11_730_r08","level":730,"kind":"reading","skill":"読解","text":"What will be different about this meeting?","options":["It will start an hour earlier.","It will last longer than usual.","It will be held in another room.","Participants must print the agenda."],"answer":1,"translation":"質問：今回の会議は普段と何が違いますか。\n正解：普段より長くなります。","explanation":"usual hour（通常1時間）に対し ninety minutes（90分）を確保するよう求めています。場所と開始時刻は変わりません。","title":"社内会議の変更点","passage":"To: Marketing team\nSubject: Product planning meeting\n\nOur planning meeting will still take place in Room B on Friday at 2 p.m. However, please allow ninety minutes instead of the usual hour because the packaging designer will join us for a discussion. The agenda is attached. There is no need to print it; copies will be on the table.","proof":"please allow ninety minutes instead of the usual hour"},{"id":"re11_730_r09","level":730,"kind":"reading","skill":"読解","text":"Where can the owner collect the mug?","options":["Inside Conference Room C","In the staff cafeteria","At the ground-floor reception desk","At the workshop organizer's home"],"answer":2,"translation":"質問：持ち主はマグをどこで受け取れますか。\n正解：1階の受付。","explanation":"発見場所は会議室Cですが、現在の保管場所は reception desk on the ground floor。発見場所と受け取り場所を区別します。","title":"忘れ物の返却","passage":"Lost property notice\n\nA silver travel mug was found in Conference Room C after yesterday's workshop. It has a small blue star on the lid. The mug is being kept at the reception desk on the ground floor. The owner can collect it during office hours. Items not claimed within one month will be donated.","proof":"The mug is being kept at the reception desk on the ground floor."},{"id":"re11_730_r10","level":730,"kind":"reading","skill":"読解","text":"What will happen to orders placed before the maintenance?","options":["Customers must place them again.","They will be automatically canceled.","They will be processed as usual.","They can only be collected in person."],"answer":2,"translation":"質問：保守開始前の注文はどうなりますか。\n正解：通常どおり処理されます。","explanation":"processed normally の言い換えが processed as usual。サイトが一時停止しても、注文をやり直す指示はありません。","title":"オンラインショップの保守","passage":"Website maintenance\n\nOur online shop will be unavailable between 1 a.m. and 5 a.m. on Sunday while we upgrade the payment system. Orders placed before the maintenance begins will be processed normally. Our city-center store will open at 10 a.m. as usual. Customer service by telephone resumes at 9 a.m. on Monday.","proof":"Orders placed before the maintenance begins will be processed normally."},{"id":"re11_730_r11","level":730,"kind":"reading","skill":"読解","text":"How will Rosa recognize Owen?","options":["He will be waiting inside the office.","He will be holding a sign with the company name.","He will be wearing a red jacket.","He will be driving a taxi."],"answer":1,"translation":"質問：ローザはどうやってオーウェンを見つけられますか。\n正解：会社名を書いた表示を持っています。","explanation":"with a sign showing our company name が目印です。赤い上着などの情報は本文にありません。","title":"駅での待ち合わせ","passage":"Hi Rosa,\n\nI'll meet you at North Station tomorrow. Please use the west exit, not the main exit near the taxi rank. I'll be standing beside the information board with a sign showing our company name. If your train is delayed, send me a text message. The office is a short walk from the station.\n\nOwen","proof":"with a sign showing our company name"},{"id":"re11_730_r12","level":730,"kind":"reading","skill":"読解","text":"What should participants prepare before the workshop?","options":["A laptop with the required program installed","An additional payment for instructions","Customer data from their workplace","Printed copies of the practice files"],"answer":0,"translation":"質問：参加者は研修前に何を準備する必要がありますか。\n正解：必要なソフトウェアをインストールしたノートパソコン。","explanation":"already installed が事前準備を示しています。練習ファイルと印刷された手順書は提供されます。","title":"研修の持ち物","passage":"Spreadsheet workshop\n\nPlease bring a laptop with the spreadsheet program already installed. Practice files will be supplied at the start of the session, and power outlets are available at every desk. Printed instructions are included in the course fee. Participants do not need to bring sample data from their own companies.","proof":"Please bring a laptop with the spreadsheet program already installed."},{"id":"re11_730_r13","level":730,"kind":"reading","skill":"読解","text":"Who needs to contact the catering team by June 17?","options":["Employees who will not attend","Employees who want to order lunch","Every employee attending the briefing","Only employees who need drinking water"],"answer":1,"translation":"質問：6月17日までにケータリング担当に連絡する必要があるのは誰ですか。\n正解：昼食を注文したい従業員。","explanation":"期限は lunch orders に対するものです。説明会自体は登録不要で、昼食を頼まなくても参加できます。","title":"説明会の昼食注文","passage":"Staff briefing — June 20\n\nThe briefing is open to all employees and does not require registration. It begins at 11 a.m. in the auditorium. Sandwich lunches can be ordered for $8, but orders must reach the catering team by June 17. Employees may attend the briefing without ordering lunch. Water will be provided free of charge.","proof":"Sandwich lunches can be ordered for $8, but orders must reach the catering team by June 17."},{"id":"re11_730_r14","level":730,"kind":"reading","skill":"読解","text":"What are employees asked to do before leaving on Monday?","options":["Take their computers home","Complete the installation themselves","Save their files and clear space around the monitors","Disconnect every keyboard and mouse"],"answer":2,"translation":"質問：月曜日の退勤前に、従業員は何をするよう求められていますか。\n正解：ファイルを保存し、モニター周辺のスペースを空ける。","explanation":"Before leaving on Monday の直後に2つの準備が示されています。キーボードとマウスは接続したままでかまいません。","title":"パソコン交換の準備","passage":"To: Accounts department\nSubject: New computers\n\nOur technicians will replace your desktop computers on Tuesday morning. Before leaving on Monday, please save your files to the shared drive and clear the space around each monitor. You may leave your keyboards and mice connected, as these will not be replaced. Installation should be complete by noon.","proof":"please save your files to the shared drive and clear the space around each monitor."},{"id":"re11_730_r15","level":730,"kind":"reading","skill":"読解","text":"What should members do with their current card after renewing?","options":["Collect a new card immediately","Mail it back to the office","Replace it with a paper form","Continue using it"],"answer":3,"translation":"質問：更新後、現在の会員証はどうすればよいですか。\n正解：そのまま使い続ける。","explanation":"continue to use your existing card と明記されています。新しいカードは発行されません。","title":"会員資格の更新","passage":"Dear member,\n\nYour annual membership expires on August 31. You can renew online using the member number printed on your card. We no longer send paper renewal forms. After renewing, continue to use your existing card; a new one will not be issued. Please update your email address in your account if it has changed.","proof":"After renewing, continue to use your existing card; a new one will not be issued."},{"id":"re11_800_r01","level":800,"kind":"reading","skill":"読解","text":"What will the supplier do if the customer does not respond?","options":["Keep the original order on hold","Dispatch the original model immediately","Send the larger model and charge the difference","Cancel the order and issue a refund"],"answer":0,"translation":"質問：顧客から返信がなければ、供給会社はどうしますか。\n正解：元の注文を保留したままにします。","explanation":"Until we hear from you と remain on hold を結び付けます。自動の代替発送も返金も記載されていません。","title":"在庫切れ商品の代替案","passage":"Subject: Your monitor order\n\nThe 24-inch monitors you selected are back-ordered until the end of the month. We have the 27-inch model available for immediate dispatch, but it costs $45 more per unit. We will not substitute it without your written approval. Until we hear from you, your original order will remain on hold. No payment has yet been taken. Please let us know whether you prefer to wait or receive a revised quotation for the larger model.","proof":"Until we hear from you, your original order will remain on hold."},{"id":"re11_800_r02","level":800,"kind":"reading","skill":"読解","text":"What is the customer asked to provide next?","options":["A photograph of the lamp's serial number","Payment for a second lamp","Proof of a purchase made within seven days","The original unopened packaging"],"answer":0,"translation":"質問：顧客は次に何を提出するよう求められていますか。\n正解：ランプの製造番号の写真。","explanation":"今回の依頼は写真の送付です。開封済みでも故障品は交換対象で、代わりの商品を新たに購入する必要もありません。","title":"返品条件の例外","passage":"Customer service reply\n\nOur standard return period is fourteen days from delivery. However, products reported as faulty within thirty days are eligible for a replacement even if the packaging has been opened. Your message indicates that the lamp stopped working after ten days. Please send a photograph of the serial number on its base. Once we identify the model, we will arrange a collection and send a replacement. There is no need to purchase a new lamp while we process your claim.","proof":"Please send a photograph of the serial number on its base."},{"id":"re11_800_r03","level":800,"kind":"reading","skill":"意図・言い換え","text":"What does Paul mean by \"That buys us some time\"?","options":["The team has more time to prepare the draft.","The final publication date has been postponed.","The team can stop working until Thursday.","The client has paid for extra design work."],"answer":0,"translation":"質問：「That buys us some time」でポールは何を意味していますか。\n正解：草稿を準備する時間に余裕ができたということ。","explanation":"buy time は時間の余裕を作ることを表す比喩です。延長されたのは草稿の締切で、最終の発行日は変わっていません。","title":"締切延長のチャット","passage":"Mina, 10:05: The client has moved the draft deadline from today to Thursday.\nPaul, 10:06: That buys us some time. The designer is still checking the diagrams.\nMina, 10:07: Yes, but the final publication date hasn't changed.\nPaul, 10:08: I'll ask her to finish the diagrams tomorrow so we can proofread everything before Thursday.\nMina, 10:09: Good. Please keep the printer informed if anything else changes.","proof":"The client has moved the draft deadline from today to Thursday."},{"id":"re11_800_r04","level":800,"kind":"reading","skill":"読解","text":"Why are separate correction notices being prepared?","options":["The festival has been canceled.","The volunteers refuse to distribute the guide.","The printed guides cannot be replaced in time.","The website cannot be updated."],"answer":2,"translation":"質問：なぜ別紙の訂正案内を用意しているのですか。\n正解：印刷済みのガイドを期限までに差し替えられないため。","explanation":"印刷物は配布先に納品済みで、開幕までの差し替えが不可能です。ウェブサイトの番号はすでに修正されています。","title":"印刷物の修正依頼","passage":"Dear Helena,\n\nThank you for spotting the incorrect telephone number in the festival guide. The printed copies have already been delivered to the venues, so we cannot replace them before opening day. We have corrected the number on the website and prepared small correction notices for the information desks. Volunteers will also mention the error when handing out the guide. For next year's edition, please review the contact section before it goes to the printer.\n\nSam","proof":"we cannot replace them before opening day."},{"id":"re11_800_r05","level":800,"kind":"reading","skill":"読解","text":"What must Mr. Lin consider before accepting the alternative venue?","options":["Whether guests can pay for a second venue","Whether the event can be moved to October 9","Whether fewer guests can be invited","Whether the reception can finish earlier"],"answer":3,"translation":"質問：代替会場を受け入れる前に、リンさんは何を検討する必要がありますか。\n正解：レセプションを早めに終えられるか。","explanation":"テラスは希望より1時間早く閉まります。雨天時の予備室は追加料金なしで、人数削減や日付変更は条件ではありません。","title":"会場からの代替提案","passage":"Dear Mr. Lin,\n\nThe private lounge you requested for the reception is unavailable on October 8. Our garden terrace can accommodate your group, and we can reserve an indoor dining area as a backup in case of rain. The terrace closes at 9 p.m., which is an hour earlier than your proposed finishing time. There is no additional charge for the backup area. Please confirm whether an earlier finish would work for your guests before we issue a contract.\n\nEvents team","proof":"Please confirm whether an earlier finish would work for your guests"},{"id":"re11_800_r06","level":800,"kind":"reading","skill":"読解","text":"Which statement about eligibility is correct?","options":["Everyone must complete the introductory course.","Students without any editing experience are preferred.","Buying a software license guarantees acceptance.","Relevant experience can substitute for the introductory course."],"answer":3,"translation":"質問：受講資格について正しい記述はどれですか。\n正解：関連する実務経験で入門講座の受講に代えられます。","explanation":"one way と but equivalent practical experience is also accepted がポイント。入門講座の修了だけが条件ではありません。","title":"上級講座の受講条件","passage":"Advanced photo editing — Course information\n\nThis course is intended for people who already use the basic editing tools confidently. Completion of our introductory course is one way to meet this requirement, but equivalent practical experience is also accepted. Before registering, new students should send the instructor three examples of their recent work. Software licenses are not included in the fee. Students will use their own laptops in class.","proof":"equivalent practical experience is also accepted."},{"id":"re11_800_r07","level":800,"kind":"reading","skill":"読解","text":"Why might some employees need to use a different bus?","options":["The station pickup point is moving.","All later shuttle services are being canceled.","The shuttle fare is increasing.","The first shuttle will arrive after their shifts begin."],"answer":3,"translation":"質問：一部の従業員が別のバスを使う必要があるのはなぜですか。\n正解：最初のシャトル便が始業時刻より後に到着するため。","explanation":"7時40分発で所要30分なので到着は8時10分。8時始業の人には遅くなります。後続便の時刻は変わりません。","title":"通勤バスの変更","passage":"To: Staff using the campus shuttle\n\nFrom next Monday, the first shuttle will leave Central Station at 7:40 a.m., twenty minutes later than at present. Later departures will keep their current times. The change reflects low demand for the earliest service. Employees whose shifts begin at 8 a.m. may need to use the public bus instead, since the shuttle journey normally takes thirty minutes. A public-bus timetable is attached for reference.","proof":"since the shuttle journey normally takes thirty minutes."},{"id":"re11_800_r08","level":800,"kind":"reading","skill":"読解","text":"What advantage does the loan unit offer?","options":["The customer can use the label rolls she already has.","It does not require electricity.","It eliminates the need to repair the original printer.","It will be given to the customer permanently."],"answer":0,"translation":"質問：代替機にはどのような利点がありますか。\n正解：現在持っているラベル用紙をそのまま使えます。","explanation":"the same label rolls が根拠です。loan unit は貸出機なので、永久に譲渡されるわけではありません。","title":"修理中の代替機","passage":"Dear Ms. Noor,\n\nThe replacement component for your label printer arrived today, but it must pass a quality check before we can install it. We expect to return your printer on Friday rather than Wednesday. To avoid interrupting your work, we can deliver a loan unit tomorrow at no charge. It uses the same label rolls as your current printer. Please reply by 4 p.m. if you would like us to reserve it.\n\nTechnical support","proof":"It uses the same label rolls as your current printer."},{"id":"re11_800_r09","level":800,"kind":"reading","skill":"読解","text":"What should suppliers change from April 15?","options":["The address used for paper invoices","The email address used for electronic invoices","The warehouse used for deliveries","The agreed payment schedule"],"answer":0,"translation":"質問：供給業者は4月15日から何を変更すべきですか。\n正解：紙の請求書を送る住所。","explanation":"変更されるのは経理事務所の住所です。電子請求書の宛先、支払予定、商品の納品先はすべて据え置きです。","title":"移転に伴う手続き","passage":"Supplier bulletin\n\nOur accounts office will move to 18 Harbor Lane on April 15. Please send paper invoices to the new address from that date. Electronic invoices should continue to be sent to the same email address, and our payment schedule remains unchanged. Deliveries of goods must still go to the West Park warehouse, not to either accounts-office address. There will be no interruption to warehouse operations during the move.","proof":"Please send paper invoices to the new address from that date."},{"id":"re11_800_r10","level":800,"kind":"reading","skill":"読解","text":"What is the writer's recommendation?","options":["Use the downtown results as the only training material","Abandon the system because waiting times increased","Test the system in a different operating environment before expanding it","Introduce the system at every branch immediately"],"answer":2,"translation":"質問：筆者は何を勧めていますか。\n正解：全面展開前に、異なる運営環境でシステムを試すこと。","explanation":"改善は出ていますが、試験は需要が比較的予測しやすい1拠点だけ。需要の変動が大きい拠点での追加検証を提案しています。","title":"試験運用への評価","passage":"Pilot scheduling report\n\nDuring the four-week trial, the new booking system reduced average waiting times from twelve minutes to eight. Staff also reported fewer double bookings. However, the trial involved only the downtown office, where customer numbers are relatively predictable. Before introducing the system across all branches, we recommend a second trial at a location with more variable demand. Training materials should be revised using feedback from both sites.","proof":"we recommend a second trial at a location with more variable demand."},{"id":"re11_800_r11","level":800,"kind":"reading","skill":"読解","text":"What must happen before a partial refund can be confirmed?","options":["The administration charge must be waived","The market must be postponed","Another vendor must accept and pay for the stall","The customer must book a larger stall"],"answer":2,"translation":"質問：一部返金が確定するには何が必要ですか。\n正解：別の出店者が区画を受け入れ、支払いを済ませること。","explanation":"待機者はいますが、代わりの出店が確定したわけではありません。confirm and pay の両方が必要です。","title":"出店キャンセルの取り扱い","passage":"Market organizer's reply\n\nWe received your request to cancel your stall booking. Deposits are normally nonrefundable within ten days of the market. However, if another vendor takes the space, we return the deposit minus a $20 administration charge. There is currently one vendor on our waiting list who needs a stall of your size. We will contact them today, but cannot promise a refund until they confirm and pay for the space.","proof":"cannot promise a refund until they confirm and pay for the space."},{"id":"re11_800_r12","level":800,"kind":"reading","skill":"読解","text":"Why is Priya not ready to accept the proposal?","options":["Management has rejected all software purchases.","The revised price is too high.","The supplier refused to revise its proposal.","She wants to check how the software handles a particular type of data."],"answer":3,"translation":"質問：プリヤがまだ提案を受諾できないのはなぜですか。\n正解：特定のデータをソフトがどう扱うか確認したいため。","explanation":"価格は予算内ですが、不完全な記録の処理を実データで確かめたい、と述べています。価格ではなく機能の検証が残っています。","title":"契約前の確認依頼","passage":"Dear Eric,\n\nYour proposal addresses several of the issues we raised, and the revised price is within our budget. Nevertheless, we are not yet in a position to commit. Could you arrange a demonstration using our own sample data? We need to see how the software handles incomplete records before we decide. If the demonstration is successful, we can discuss a start date at our next management meeting.\n\nPriya","proof":"We need to see how the software handles incomplete records before we decide."},{"id":"re11_800_r13","level":800,"kind":"reading","skill":"意図・言い換え","text":"What does \"walk-in\" indicate about the Tuesday consultations?","options":["People may attend without arranging an appointment.","Every visitor receives a detailed financial review.","Visitors must complete a guided walking tour.","Consultations are held outdoors."],"answer":0,"translation":"質問：火曜日の相談で「walk-in」は何を表していますか。\n正解：予約せずに参加できること。","explanation":"直後の No appointment is necessary が言い換えです。詳しい財務書類の審査は別途予約が必要です。","title":"相談会の案内表現","passage":"Small Business Center\n\nFree walk-in consultations are available every Tuesday from 1 to 4 p.m. Advisors can discuss business plans, basic bookkeeping, and local licensing procedures. No appointment is necessary, but visitors are seen in order of arrival. For a detailed review of financial statements, please book a separate session in advance. The Tuesday service is intended for short, general inquiries.","proof":"No appointment is necessary, but visitors are seen in order of arrival."},{"id":"re11_800_r14","level":800,"kind":"reading","skill":"読解","text":"When does the opportunity to revise an order end?","options":["When the customer receives the parcel","When the order status changes to \"Packed\"","When the courier collects the parcel","When the confirmation email is opened"],"answer":1,"translation":"質問：注文内容を修正できるのはいつまでですか。\n正解：注文の状態が「Packed」に変わるまで。","explanation":"境界は梱包済みになった時点です。配送業者がまだ集荷していなくても、それ以降は変更できません。","title":"注文の修正期限","passage":"Order desk notice\n\nYou may change the delivery address or quantity of an order until it is marked \"Packed\" in your account. Once that status appears, our warehouse cannot make changes, even if the parcel has not yet been collected by the courier. To avoid delays, check your confirmation email as soon as it arrives. Requests sent after packing will be treated as a new order rather than a revision to the original one.","proof":"You may change the delivery address or quantity of an order until it is marked \"Packed\" in your account."},{"id":"re11_800_r15","level":800,"kind":"reading","skill":"読解","text":"What should an employee do about an urgent safety problem?","options":["Report it directly to the building help desk","Enter an employee number in the questionnaire","Send the survey results to all locations","Wait until the survey closes"],"answer":0,"translation":"質問：緊急の安全上の問題はどうすべきですか。\n正解：建物のヘルプデスクへ直接報告する。","explanation":"アンケートは設備の傾向を把握するもので、緊急修理の受付ではありません。immediate safety risk の場合は直接連絡します。","title":"社内アンケートの匿名性","passage":"Staff facilities survey\n\nPlease complete the facilities survey by Friday. The questionnaire does not collect names or employee numbers. Results will be grouped by work location so that we can identify which buildings need attention. This survey is not a channel for urgent maintenance requests. If a fault presents an immediate safety risk, contact the building help desk directly instead of waiting for the survey results to be reviewed.","proof":"contact the building help desk directly instead of waiting for the survey results to be reviewed."},{"id":"re11_850_r01","level":850,"kind":"reading","skill":"複数文書","text":"Which service meets the team's stated requirement?","options":["Standard","None of the services","Priority","Early"],"answer":3,"translation":"質問：チームが指定した条件を満たすサービスはどれですか。\n正解：Early。","explanation":"火曜日13時に準備できるので14時の締切に間に合います。水曜日13時前を保証するのは正午前到着の Early。Priority は水曜日の終わりまでなので不十分です。","title":"納期と発送予定の照合","passage":"DOCUMENT 1 — Delivery services\n\nStandard: delivery within three business days after dispatch.\nPriority: delivery by the end of the next business day after dispatch.\nEarly: delivery before noon on the next business day after dispatch.\nAll services require the parcel to be ready by 2 p.m. on the dispatch day.\n\nDOCUMENT 2 — Message from the project team\n\nThe samples will be ready at 1 p.m. on Tuesday. Our client needs them before a demonstration that starts at 1 p.m. on Wednesday. Please choose the service that guarantees arrival before the demonstration. There are no public holidays this week.","proof":"Early: delivery before noon on the next business day after dispatch."},{"id":"re11_850_r02","level":850,"kind":"reading","skill":"複数文書","text":"What meal breakdown should appear on the revised booking?","options":["28 standard meals and 4 vegetarian meals","26 standard meals and 4 vegetarian meals","30 standard meals and 4 vegetarian meals","24 standard meals and 4 vegetarian meals"],"answer":1,"translation":"質問：変更後の予約の食事の内訳はどうなりますか。\n正解：通常食26食、ベジタリアン食4食。","explanation":"追加後の総人数は30人で、そのうち4人がベジタリアン食。30＋4ではありません。4日前の増員で厨房の承認もあり、変更条件を満たします。","title":"ケータリングの人数変更","passage":"DOCUMENT 1 — Catering agreement\n\nThe confirmed booking is for 28 people. Increases may be accepted until three days before the event, subject to kitchen capacity. Reductions require at least seven days' notice. Vegetarian meals cost the same as standard meals but must be included in the final meal breakdown.\n\nDOCUMENT 2 — Email, four days before the event\n\nTwo additional colleagues will attend, bringing our group to 30. The kitchen has confirmed that it can handle the increase. Four people in the entire group would like vegetarian meals. Please revise the booking accordingly.","proof":"Four people in the entire group would like vegetarian meals."},{"id":"re11_850_r03","level":850,"kind":"reading","skill":"複数文書","text":"Which response is most consistent with the advertisement?","options":["The applicant may apply now but must obtain the certificate before starting.","Three years of experience removes the certificate requirement.","The applicant must wait until June 1 to apply.","A certificate is required before an application can be submitted."],"answer":0,"translation":"質問：求人広告の内容に最も合う返答はどれですか。\n正解：今応募できるが、就業開始前に資格証を取得する必要がある。","explanation":"受講中の応募が明示的に認められています。ただし初出勤日までの有効な資格証は必要で、経験だけでは免除されません。","title":"求人条件と応募者の状況","passage":"DOCUMENT 1 — Position requirements\n\nCandidates for the site supervisor role must have a current safety certificate by their first working day. Applicants whose certification course is in progress may apply. At least two years of relevant supervisory experience is required. The position is due to begin on June 1.\n\nDOCUMENT 2 — Applicant's message\n\nI have supervised a distribution team for three years. My safety course finishes on May 20, and the provider has confirmed that my certificate will be issued on May 24 if I pass the final assessment. May I submit my application before the certificate is issued?","proof":"Applicants whose certification course is in progress may apply."},{"id":"re11_850_r04","level":850,"kind":"reading","skill":"複数文書","text":"Which issue should the audit identify?","options":["The loading door was left unsecured.","The departure was authorized by the wrong person.","The vehicle should not have left empty.","Cargo was damaged during the journey."],"answer":1,"translation":"質問：監査では何を問題として指摘すべきですか。\n正解：出発の承認を行った人が適切ではなかったこと。","explanation":"監督者が確認・署名する規則なのに運転者が代筆しています。空車でも適用され、安全に戻ったことでは手続き違反を解消できません。","title":"作業規則と点検記録","passage":"DOCUMENT 1 — Loading-area rules\n\nBefore a delivery vehicle moves away from a bay, the loading supervisor must verify that the door is secured and sign the departure log. Drivers may not sign on the supervisor's behalf. These requirements apply even if the vehicle is leaving empty.\n\nDOCUMENT 2 — Audit note\n\nAt 10:15, an empty vehicle left Bay 4. The door was secured. The departure log was signed by the driver because the supervisor had gone to another bay. No cargo was damaged, and the vehicle returned safely later that morning.","proof":"Drivers may not sign on the supervisor's behalf."},{"id":"re11_850_r05","level":850,"kind":"reading","skill":"複数文書","text":"What total is the customer being asked to approve?","options":["$400","$520","$340","$460"],"answer":3,"translation":"質問：顧客が承認するよう求められている合計額はいくらですか。\n正解：460ドル。","explanation":"最初の400ドルには作業費と材料費が含まれますが、許可料は別です。追加の60ドルだけを足して460ドル。材料費の二重加算は不要です。","title":"見積書に含まれない費用","passage":"DOCUMENT 1 — Contractor's estimate\n\nSign installation: $400, including labor and all mounting materials. The city permit fee is not included and will be added at cost. No other charges apply. The price is valid for thirty days.\n\nDOCUMENT 2 — Follow-up email\n\nThe city has confirmed that the permit for this sign will cost $60. We can obtain it on your behalf and include it on the same invoice. The installation method is unchanged, so the labor and materials price quoted earlier still stands. Please approve the revised total before we order the materials.","proof":"The city permit fee is not included and will be added at cost."},{"id":"re11_850_r06","level":850,"kind":"reading","skill":"複数文書","text":"What does Nadia intend by saying \"Let's not get ahead of ourselves\"?","options":["Marketing should take responsibility for mobile testing.","The team should stop testing and launch immediately.","The desktop test results should be discarded.","A launch decision should wait until the remaining tests are completed."],"answer":3,"translation":"質問：「Let's not get ahead of ourselves」でナディアは何を伝えていますか。\n正解：残りのテストが終わるまで公開判断を待つべきだということ。","explanation":"先走らないで、という意図です。資料1ではモバイル試験が未実施で、会話でもその結果待ちが確認できます。デスクトップの結果を否定しているわけではありません。","title":"公開判断を急がない意図","passage":"DOCUMENT 1 — Test summary\n\nThe revised booking page passed all desktop-browser tests. Mobile-device tests are scheduled for tomorrow. No real customer transactions have been processed on the new page.\n\nDOCUMENT 2 — Team chat\n\nLeo: The desktop results look excellent. Shall I tell marketing we can launch tonight?\nNadia: Let's not get ahead of ourselves. We still have an entire set of tests outstanding.\nLeo: Right. I'll wait for the mobile results before asking for a launch decision.\nNadia: Thanks. Please send those results to the support team as well.","proof":"Mobile-device tests are scheduled for tomorrow."},{"id":"re11_850_r07","level":850,"kind":"reading","skill":"複数文書","text":"Which instruction should be sent to Eva?","options":["Enter through the main entrance at 8:15 a.m.","Use the underground car park and main entrance.","Park at street level and enter through the east entrance.","Wait until 9 a.m. before entering."],"answer":2,"translation":"質問：エバにはどの案内を送るべきですか。\n正解：地上の駐車場所に停め、東側の入口から入る。","explanation":"氏名が警備に登録済みで8時15分の業者訪問なので、東側から早朝入館できます。ただし地下駐車場の開場は9時です。","title":"訪問者の入館例外","passage":"DOCUMENT 1 — Building access notice\n\nThe main entrance opens at 9 a.m. Registered service contractors with appointments before 9 a.m. may use the east entrance. Security staff must have their names in advance. The underground car park remains closed until 9 a.m.; early visitors should use the street-level visitor spaces.\n\nDOCUMENT 2 — Appointment confirmation\n\nYour technician, Eva Shaw, is booked to inspect our heating system at 8:15 a.m. Her name has been sent to security. She will be arriving by car. Please remind her how to access the building at that time.","proof":"early visitors should use the street-level visitor spaces."},{"id":"re11_850_r08","level":850,"kind":"reading","skill":"複数文書","text":"How much should June pay in total?","options":["$40","$20","$80","$0"],"answer":0,"translation":"質問：ジューンはいくら支払うべきですか。\n正解：合計40ドル。","explanation":"現役ボランティアのジューンは免除、ボランティアでない隣人は40ドル。近所に住むだけでは免除されません。一括払いによる割引の記載もありません。","title":"講習費用の免除条件","passage":"DOCUMENT 1 — Community garden workshop\n\nThe workshop costs $40 per person. Current garden volunteers are exempt from the fee. Residents who are not volunteers pay the standard fee. Tools and seeds are included for all participants. Registration is required, including for those who do not have to pay.\n\nDOCUMENT 2 — Email from June\n\nPlease register me and my neighbor for the workshop. I am on this season's volunteer roster, but my neighbor has never volunteered with the garden. We both live nearby. I can pay for the two of us in a single transaction.","proof":"Current garden volunteers are exempt from the fee."},{"id":"re11_850_r09","level":850,"kind":"reading","skill":"複数文書","text":"Which replacement statement would be accurate?","options":["Every depot will receive electric vans next month.","All diesel vans at the East Depot have been removed.","An electric-van trial is under way at one depot, and wider expansion is undecided.","The six-month trial has already been completed."],"answer":2,"translation":"質問：差し替える文として正確なのはどれですか。\n正解：1拠点で電気自動車を試験運用中で、全体への拡大は未決定である。","explanation":"資料1は1拠点での試験・ディーゼル車の継続使用・拡張時期未定を示しています。広報案の全面移行済み・来月拡張という表現は裏付けがありません。","title":"広報文の過大な表現","passage":"DOCUMENT 1 — Project update\n\nThe electric delivery vans are being tested at the East Depot only. Two diesel vans remain in use there for longer routes. A decision on expanding the electric fleet to other depots will be made after the six-month trial. There is no confirmed expansion date.\n\nDOCUMENT 2 — Draft announcement\n\nOur delivery network is now entirely electric. The successful East Depot project will be extended to all depots next month. We are proud to have completed the transition ahead of schedule.\n\nEditor's note: Please revise the draft so that it accurately reflects the project update.","proof":"There is no confirmed expansion date."},{"id":"re11_850_r10","level":850,"kind":"reading","skill":"複数文書","text":"Which listed service should the exhibitor take?","options":["The hotel shuttle","Any of the three services","The public tram","The express coach"],"answer":2,"translation":"質問：出展者は一覧のどの交通手段を使うべきですか。\n正解：公共の路面電車。","explanation":"9時までの入場が条件です。到着が8時50分の路面電車だけが間に合い、9時5分着の急行バスも遅すぎます。","title":"会場移動の交通案内","passage":"DOCUMENT 1 — Transfer options\n\nHotel shuttle: departs 8:30 a.m.; arrives at the exhibition center 9:20 a.m.; guests only.\nPublic tram: departs 8:10 a.m.; arrives 8:50 a.m.; open to everyone.\nExpress coach: departs 8:45 a.m.; arrives 9:05 a.m.; reservation required.\n\nDOCUMENT 2 — Organizer's message\n\nAll exhibitors must be inside the center by 9 a.m. for the safety briefing. You are staying at the hotel, but the free shuttle does not meet this requirement. Choose a listed service that arrives in time. The vehicle entrance and pedestrian entrance open at 8:30 a.m.","proof":"Public tram: departs 8:10 a.m.; arrives 8:50 a.m.; open to everyone."},{"id":"re11_850_r11","level":850,"kind":"reading","skill":"複数文書","text":"Why does the customer's request qualify for an exception?","options":["The customer no longer likes the chosen color.","All made-to-order items may be returned within a month.","The delivered item does not match the accepted order.","Photographs automatically remove every return restriction."],"answer":2,"translation":"質問：なぜこの顧客の依頼は例外の対象になりますか。\n正解：届いた商品が受諾済み注文の仕様と一致しないため。","explanation":"気が変わったのではなく、注文した青と納品された緑が違います。翌日の申告で7日以内の条件も満たしています。","title":"特注商品の例外対応","passage":"DOCUMENT 1 — Returns policy\n\nMade-to-order items cannot be returned because a customer changes their mind. This restriction does not apply if the item is defective or differs from the specifications on the accepted order. Customers should report such problems within seven days of delivery and include photographs.\n\nDOCUMENT 2 — Customer email\n\nMy made-to-order curtains arrived yesterday. The accepted order specifies blue fabric, but the curtains are green. I have attached a photograph of the curtains and a copy of your order confirmation. Please arrange a replacement in the agreed color.","proof":"This restriction does not apply if the item is defective or differs from the specifications on the accepted order."},{"id":"re11_850_r12","level":850,"kind":"reading","skill":"複数文書","text":"How many learning hours are available to Sora in May before taking the course?","options":["Six hours","Nine hours","Twelve hours","Eight hours"],"answer":3,"translation":"質問：講座を受ける前の5月、ソラは何時間の学習時間を使えますか。\n正解：8時間。","explanation":"4月の未使用は3時間ですが、繰り越し上限は2時間。5月の新規6時間に2時間を加えて8時間です。未使用分を全額繰り越す9時間ではありません。","title":"研修時間の繰り越し","passage":"DOCUMENT 1 — Learning allowance\n\nEach employee receives six hours of paid learning time every month. Up to two unused hours may be carried into the next month only. Carried hours are used first and expire at the end of that month. Employees may not borrow hours from future months.\n\nDOCUMENT 2 — Record for Sora\n\nApril: six hours available; three hours used. No hours were carried into April.\nMay booking request: a seven-hour course, to be taken within a single month.\nSupervisor's note: Check the allowance before approving the request.","proof":"Up to two unused hours may be carried into the next month only."},{"id":"re11_850_r13","level":850,"kind":"reading","skill":"複数文書","text":"Which session can the speaker accept?","options":["Session C","Session A","Both Sessions B and C","Session B"],"answer":3,"translation":"質問：講演者が受け入れられるのはどの枠ですか。\n正解：Session B。","explanation":"Bの確認は9時45分からで、9時35分の到着に間に合います。講演も10時40分に終了。Aは到着前、Cは終了が退出予定の11時15分を超えます。","title":"講演者の時間調整","passage":"DOCUMENT 1 — Available presentation slots\n\nSession A: 9:00–9:40 a.m.\nSession B: 10:00–10:40 a.m.\nSession C: 11:00–11:40 a.m.\nSpeakers must be available for a fifteen-minute technical check immediately before their session. All sessions take place in the same building.\n\nDOCUMENT 2 — Speaker's reply\n\nMy train arrives nearby at 9:20 a.m., and I can reach the venue by 9:35 a.m. I must leave the venue at 11:15 a.m. Please assign me a slot that allows me to complete both the technical check and the entire presentation.","proof":"Speakers must be available for a fifteen-minute technical check immediately before their session."},{"id":"re11_850_r14","level":850,"kind":"reading","skill":"複数文書","text":"Which assessment of the newsletter is correct?","options":["The per-product reduction is correct, but total packaging use increased.","Both the per-product and total amounts fell by 20 percent.","Packaging use per product increased.","The figures do not allow total packaging use to be calculated."],"answer":0,"translation":"質問：ニュースレターの評価として正しいものはどれですか。\n正解：製品当たりの削減は正しいが、包装材の総使用量は増えました。","explanation":"単位当たりは10から8で20％減。しかし総量は前年10×100＝1,000kg、今年8×150＝1,200kg。生産増により総量は増加しています。","title":"削減率と絶対量の読み分け","passage":"DOCUMENT 1 — Packaging report\n\nLast year, the factory used 10 kilograms of packaging per 100 products and made 10,000 products. This year, it used 8 kilograms per 100 products and made 15,000 products. The figures cover the same product range and all packaging materials.\n\nDOCUMENT 2 — Draft newsletter\n\nWe reduced packaging use per product by 20 percent this year. Consequently, our total packaging use must also have fallen.\n\nReview request: Keep any claim supported by the figures, and correct any conclusion that does not follow.","proof":"This year, it used 8 kilograms per 100 products and made 15,000 products."},{"id":"re11_850_r15","level":850,"kind":"reading","skill":"複数文書","text":"Which payment schedule follows the written agreement?","options":["Invoice 784 by September 5; invoice 791 by September 20","Both invoices by September 20","Both invoices thirty days after the supplier's email","Invoice 784 by September 20; invoice 791 by September 12"],"answer":3,"translation":"質問：書面での合意に従う支払予定はどれですか。\n正解：請求書784は9月20日まで、791は9月12日まで。","explanation":"メールでの書面確認により784だけ期限が延長されました。例外はその1件のみで、791の9月12日は変わりません。","title":"支払条件に関する合意","passage":"DOCUMENT 1 — Purchase terms\n\nPayment is normally due within thirty days of delivery. A different payment date is valid only if the supplier confirms it in writing. Verbal discussions do not alter the invoice terms.\n\nDOCUMENT 2 — Supplier's email\n\nFollowing our call, we agree to extend the payment deadline for invoice 784 to September 20. This exception applies to invoice 784 only. Please continue to pay all other invoices according to their stated terms.\n\nDOCUMENT 3 — Accounts note\n\nInvoice 784 originally showed a September 5 deadline. Invoice 791 is due on September 12. Both remain unpaid.","proof":"This exception applies to invoice 784 only."}]}</script><script>/* Rail English 1.1 — no framework, analytics, remote fonts or AI requests. */
'use strict';
(() => {
const APP_VERSION='1.1.0';
const STORAGE_KEY='rail-english-v1';
const basePack=JSON.parse(document.getElementById('question-data').textContent);
const DAY=86400000;
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={
 rail:'<path d="M7 4h10a2 2 0 0 1 2 2v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2Z"/><path d="M5 11h14M9 7h6M8 19l-2 3m10-3 2 3"/><path d="M8 15h1m6 0h1"/>',
 home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
 review:'<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/><path d="M12 7v5l3 2"/>',
 stats:'<path d="M4 20V10m8 10V4m8 16v-7M2 21h20"/>',
 settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/>',
 arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',
 check:'<path d="m5 12 4 4L19 6"/>',
 book:'<path d="M12 5C8 2 4 3 3 4v15c2-2 6-2 9 0 3-2 7-2 9 0V4c-1-1-5-2-9 1v14"/>',
 flag:'<path d="M5 21V3c5-4 9 4 14 0v10c-5 4-9-4-14 0"/>'
};
const icon=(name,size=22)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.book}</svg>`;
const defaultState=()=>({schemaVersion:1,settings:{level:730,filter:'all',size:5,largeText:false,timer:false},progress:{},attempts:[],session:null,lastResult:null,extraQuestions:[]});
let storageError='';
let state=defaultState();
let route='home';
let offlineState={ready:false,text:'オフライン準備中',detail:'画面と問題を端末に保存します。'};
let updateReady=null;
let toastHandle;
let visibleSince=0;
let elapsedPending=0;
const textValid=(v,max=12000)=>typeof v==='string'&&v.length>0&&v.length<=max;
function validateQuestion(q){
 return q&&textValid(q.id,100)&&/^[a-zA-Z0-9_-]+$/.test(q.id)&&[730,800,850].includes(q.level)&&['cloze','reading'].includes(q.kind)&&textValid(q.skill,50)&&textValid(q.text,1500)&&Array.isArray(q.options)&&q.options.length===4&&q.options.every(o=>textValid(o,500))&&new Set(q.options).size===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4&&textValid(q.translation,5000)&&textValid(q.explanation,5000)&&(q.kind!=='cloze'||q.text.split('_____').length===2)&&(q.kind!=='reading'||textValid(q.passage)&&textValid(q.title,120));
}
function cleanState(raw){
 if(!raw||raw.schemaVersion!==1||!Array.isArray(raw.attempts)||typeof raw.progress!=='object'||raw.progress===null) throw Error('対応していない学習記録です。');
 const s=defaultState(),r=raw.settings||{};
 s.settings={level:[730,800,850].includes(r.level)?r.level:730,filter:['all','grammar','vocab','reading'].includes(r.filter)?r.filter:'all',size:[5,10].includes(r.size)?r.size:5,largeText:r.largeText===true,timer:r.timer===true};
 if(raw.extraQuestions!==undefined&&(!Array.isArray(raw.extraQuestions)||raw.extraQuestions.length>5000||!raw.extraQuestions.every(validateQuestion)))throw Error('追加問題の形式が正しくありません。');
 const baseIds=new Set(basePack.questions.map(q=>q.id));
 s.extraQuestions=(raw.extraQuestions||[]).filter(q=>!baseIds.has(q.id));
 if(new Set(s.extraQuestions.map(q=>q.id)).size!==s.extraQuestions.length)throw Error('問題IDが重複しています。');
 const known=new Set([...baseIds,...s.extraQuestions.map(q=>q.id)]);
 s.attempts=raw.attempts.filter(a=>a&&known.has(a.qid)&&textValid(a.id,120)&&Number.isFinite(a.at)&&a.at>0&&Number.isInteger(a.choice)&&a.choice>=0&&a.choice<=3&&typeof a.correct==='boolean'&&['new','review'].includes(a.type)).map(a=>({id:a.id,qid:a.qid,at:a.at,choice:a.choice,correct:a.correct,type:a.type,seconds:Math.max(0,Math.min(3600,Number(a.seconds)||0)),confidence:['clear','unsure','pending'].includes(a.confidence)?a.confidence:'pending'})).slice(-100000);
 if(new Set(s.attempts.map(a=>a.id)).size!==s.attempts.length)throw Error('回答IDが重複しています。');
 s.progress=Object.create(null);
 for(const [id,p] of Object.entries(raw.progress)){
  if(!known.has(id)||!p||!Number.isFinite(p.seen)||p.seen<1)continue;
  s.progress[id]={seen:Math.floor(p.seen),correct:Math.max(0,Math.floor(Number(p.correct)||0)),streak:Math.max(0,Math.min(20,Math.floor(Number(p.streak)||0))),due:Number.isFinite(p.due)?p.due:0,needsReview:p.needsReview===true,lastAt:Number.isFinite(p.lastAt)?p.lastAt:0};
 }
 const x=raw.session;
 if(x&&Array.isArray(x.qids)&&x.qids.length>0&&x.qids.length<=10&&x.qids.every(id=>known.has(id))&&new Set(x.qids).size===x.qids.length&&Number.isInteger(x.index)&&x.index>=0&&x.index<x.qids.length&&Array.isArray(x.attemptIds)&&x.attemptIds.length<=x.qids.length&&x.attemptIds.every(id=>s.attempts.some(a=>a.id===id))){
  s.session={id:typeof x.id==='string'?x.id:'resumed',mode:['daily','new','review','mistakes','practice'].includes(x.mode)?x.mode:'daily',qids:x.qids,index:x.index,attemptIds:x.attemptIds,started:Number(x.started)||Date.now()};
  if(x.attemptIds.length<x.index||x.attemptIds.length>x.index+1||x.attemptIds.some((id,i)=>s.attempts.find(a=>a.id===id)?.qid!==x.qids[i]))s.session=null;
 }
 return s;
}
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)state=cleanState(JSON.parse(raw));}catch(e){storageError='保存済みの記録を読み込めませんでした。元データを上書きしないため保存を停止しています。「設定」から元データを書き出してください。';}
let questions=[...basePack.questions,...state.extraQuestions];
let byId=new Map(questions.map(q=>[q.id,q]));
function refreshQuestions(){questions=[...basePack.questions,...state.extraQuestions];byId=new Map(questions.map(q=>[q.id,q]));}
function save(){
 if(storageError)return false;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true;}catch(e){storageError='端末に記録を保存できません。今の画面では学習できますが、閉じる前に「設定」でバックアップしてください。';renderStorageWarning();return false;}
}
function renderStorageWarning(){const b=$('#storage-warning');b.textContent=storageError;b.classList.toggle('hidden',!storageError);}
const todayKey=(time=Date.now())=>{const d=new Date(time);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const formatDate=n=>new Date(n).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
const percent=(n,d)=>d?`${Math.round(n/d*100)}%`:'—';
const progressFor=q=>state.progress[typeof q==='string'?q:q.id];
const courseName=level=>({730:'730点を目指す',800:'800点に挑戦',850:'800点台を固める'}[level]);
const kindName=q=>q.kind==='reading'?'短文読解':'短文穴埋め';
function filtered(){return questions.filter(q=>q.level===state.settings.level&&(state.settings.filter==='all'||(state.settings.filter==='reading'?q.kind==='reading':state.settings.filter==='vocab'?['語彙','日程・会議'].includes(q.skill):q.kind==='cloze'&&!['語彙','日程・会議'].includes(q.skill))));}
const dueQuestions=(pool=questions)=>pool.filter(q=>progressFor(q)&&progressFor(q).due<=Date.now());
const mistakes=()=>questions.filter(q=>progressFor(q)?.needsReview);
const firstAttempts=()=>state.attempts.filter(a=>a.type==='new');
const todayAttempts=()=>state.attempts.filter(a=>todayKey(a.at)===todayKey());
function streakDays(){
 const days=new Set(state.attempts.map(a=>todayKey(a.at)));let d=new Date(),n=0;
 if(!days.has(todayKey(d.getTime())))d.setDate(d.getDate()-1);
 while(days.has(todayKey(d.getTime()))&&n<10000){n++;d.setDate(d.getDate()-1);}return n;
}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function selectSession(mode){
 const pool=filtered(),fresh=shuffle(pool.filter(q=>!progressFor(q))),due=shuffle(dueQuestions(pool));let selection=[];
 if(mode==='review')selection=dueQuestions().sort((a,b)=>progressFor(a).due-progressFor(b).due);
 else if(mode==='mistakes')selection=shuffle(mistakes());
 else if(mode==='new')selection=fresh;
 else if(mode==='practice')selection=shuffle(pool);
 else {
  const taken=new Set();const add=xs=>{for(const q of xs)if(!taken.has(q.id)){selection.push(q);taken.add(q.id);}};
  add(due.slice(0,Math.min(2,state.settings.size)));add(fresh);add(due);
 }
 return selection.slice(0,state.settings.size).map(q=>q.id);
}
function toast(msg){const box=$('#toast');box.textContent=msg;box.classList.remove('hidden');clearTimeout(toastHandle);toastHandle=setTimeout(()=>box.classList.add('hidden'),4500);}
function renderHeader(){
 $('.brand-logo').innerHTML=icon('rail',23);
 const b=$('#offline-status');b.classList.toggle('is-ready',offlineState.ready);b.innerHTML=`<span class="dot"></span><span>${esc(offlineState.text)}</span>`;
 b.title=offlineState.detail;
 $('#bottom-nav').innerHTML=[['home','ホーム','home'],['review','復習','review'],['stats','記録','stats'],['settings','設定','settings']].map(([r,label,ic])=>`<button class="nav-item ${route===r?'active':''}" data-action="nav" data-route="${r}" ${route===r?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('');
}
function todayWeek(){let html='';for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const list=state.attempts.filter(a=>todayKey(a.at)===todayKey(d.getTime()));html+=`<div class="day"><div class="day-box ${list.length?'done':''} ${i===0?'today':''}">${list.length||'·'}</div>${['日','月','火','水','木','金','土'][d.getDay()]}</div>`;}return html;}
function intro(eyebrow,title,desc){return `<div class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="date-tag">${new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'})}</div></div>`;}
function renderHome(){
 const today=todayAttempts(),first=firstAttempts(),pool=filtered(),fresh=pool.filter(q=>!progressFor(q)).length,seen=pool.length-fresh,due=dueQuestions().length;
 const s=state.session;
 return `${intro('SMALL STEPS, BIG GOALS.','通勤時間を、積み重ねに。','まずは730点。その先の800点台まで、自分のペースで。')}
 <div class="layout"><div class="stack">
 <section class="card hero"><div class="hero-label">YOUR DAILY PRACTICE</div><div class="hero-heading"><div><h2>${s?'続きから、もう1問。':`今日の${state.settings.size}問`}</h2><p>${s?`${s.index+1}問目から再開できます`:'新しい問題と、必要な復習を。'}</p></div><div class="round-count" aria-label="今日の回答数 ${today.length}">${today.length}<small>問</small></div></div><button class="btn full" data-action="${s?'resume':'start'}" data-mode="daily">${s?'続きから再開する':'学習をはじめる'}${icon('arrow',19)}</button><div class="hero-foot"><span>${esc(courseName(state.settings.level))}</span><span>1問ごとに記録を保存</span></div></section>

function activeAttempt(){const s=state.session;return s?state.attempts.find(a=>a.id===s.attemptIds[s.index]):null;}

 const s=state.session;if(!s){route='home';return renderHome();}const q=byId.get(s.qids[s.index]),a=activeAttempt();

 <section class="card question-card"><div class="question-number">${esc(kindName(q))} <span class="muted">/ ${q.id}</span></div>${q.kind==='reading'?`<div class="passage-title">${esc(q.title)}</div><div class="passage" lang="en">${esc(q.passage)}</div>`:''}<h2 class="question-text" lang="en">${esc(q.text).replace('_____','<span class="blank">_____</span>')}</h2><div class="choices" role="group" aria-label="解答の選択肢">${q.options.map((opt,i)=>`<button class="choice ${a?(i===q.answer?'correct':i===a.choice?'wrong':'unselected'):''}" data-action="answer" data-choice="${i}" ${a?'disabled':''} aria-label="${'ABCD'[i]} ${esc(opt)}"><span class="choice-letter">${'ABCD'[i]}</span><span class="choice-word" lang="en">${esc(opt)}</span>${a&&(i===q.answer||i===a.choice)?`<span class="choice-mark" aria-hidden="true">${i===q.answer?'✓':'×'}</span>`:''}</button>`).join('')}</div>${!a?'<p class="quiz-hint">答えを1つ選んでください</p>':''}</section>
 ${a?`<section class="card feedback" id="feedback" tabindex="-1" aria-label="正解と解説"><div class="feedback-status ${a.correct?'':'incorrect'}">${a.correct?'✓':'↺'} ${status}</div><div class="answer-label">${q.kind==='cloze'?'完成した正解文':'正解の選択肢'}</div><p class="complete-sentence" lang="en">${full}</p><p class="translation">${esc(q.translation)}</p><div class="explain"><h3>ここを押さえよう</h3><p>${esc(q.explanation)}</p>${q.proof?`<div class="proof-label">本文の根拠</div><div class="proof" lang="en">${esc(q.proof)}</div>`:''}</div><div class="confidence">${a.correct?`<p>自信を持って答えられましたか？</p><div class="row-two"><button class="btn secondary" data-action="next" data-confidence="unsure">迷った</button><button class="btn" data-action="next" data-confidence="clear">わかった ${icon('arrow',17)}</button></div>`:`<p>この問題は自動で復習に残します。</p><button class="btn full" data-action="next" data-confidence="unsure">${next} ${icon('arrow',17)}</button>`}</div></section>`:''}</div>`;

 <div class="layout"><div class="stack"><section class="card"><div class="section-row"><h2>今日の復習</h2><span class="count-bubble">${due.length}<span class="small muted"> 問</span></span></div><p class="small muted">全コースから、復習日が来た問題を出題します。</p><button class="btn full section-space" data-action="start" data-mode="review" ${due.length?'':'disabled'}>期限が来た問題を復習する ${icon('arrow',18)}</button><div class="divider"></div><div class="section-row"><h3>いま復習したい問題</h3><span class="small muted">${needs.length}問</span></div><p class="small muted">間違えた問題や「迷った」問題は、期限前でも復習できます。</p><button class="btn secondary full section-space" data-action="start" data-mode="mistakes" ${needs.length?'':'disabled'}>間違い・迷いを復習する</button></section><section class="card"><h3>復習のタイミングについて</h3><p class="subtle-note section-space">間違い・迷いは翌日にもう一度。自信を持って正解できたら、1日 → 3日 → 7日 → 14日 → 30日の間隔で確認します。「期限が来た問題」には、覚えた内容の定期確認も含まれます。</p><p class="subtle-note section-space">回答した直後は、確認が済むまで復習候補に残します。解説の下で「わかった」または「迷った」を選ぶと確定します。</p></section></div><div class="stack"><section class="card"><div class="section-row"><h2>復習リスト</h2><span class="tag">間違い・迷い</span></div>${needs.length?needs.slice(0,30).map(q=>`<div class="list-item"><div class="list-item-main"><div class="tags">${q.level===850?'800+':q.level} · ${esc(q.skill)} · 次回 ${formatDate(progressFor(q).due)}</div><p lang="en">${esc(q.text)}</p></div></div>`).join('')+(needs.length>30?`<p class="small muted">ほか ${needs.length-30}問あります。</p>`:''):`<div class="empty"><div class="empty-icon">${icon('check',28)}</div><h3>復習リストは空です</h3><p>問題を解くと、間違いや迷いを<br>ここに集めておけます。</p><button class="btn secondary" data-action="nav" data-route="home">ホームへ</button></div>`}</section></div></div>`;}
